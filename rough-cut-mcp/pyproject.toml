[project]
name = "roughcut-mcp"
version = "0.1.0"
description = "Local MCP server that lets Claude log your footage against the script and build a Premiere Pro rough cut."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "pillow>=10.1",
    "pypdf>=4",
]

[project.optional-dependencies]
# Speech-to-text so Claude can match takes to script lines. Strongly recommended.
transcribe = ["faster-whisper>=1.0"]

[project.scripts]
roughcut-mcp = "roughcut_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roughcut_mcp"]
