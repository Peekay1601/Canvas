<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="tabs">
    <button class="tab active" data-tab="create">Create</button>
    <button class="tab" data-tab="quick">Quick</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>

  <!-- Create: describe what you want, Claude plans it, ElevenLabs generates it -->
  <section id="tab-create" class="pane active">
    <label for="prompt">What do you want?</label>
    <textarea id="prompt" rows="6" placeholder="e.g. A calm female narrator says 'Every great story begins with a single cup of chai', then a soft kettle whistle, under a warm lo-fi bed for 20 seconds."></textarea>

    <label class="check"><input type="checkbox" id="useContext" checked /> Send sequence info (name, playhead, length) to Claude</label>

    <div class="row">
      <button id="planBtn" class="primary">Plan with Claude</button>
    </div>

    <div id="planBox" class="hidden">
      <p id="planSummary" class="summary"></p>
      <div id="planItems"></div>
      <div class="placement">
        <label class="check"><input type="checkbox" id="placeOnTimeline" checked /> Place on timeline at playhead</label>
        <div class="row">
          <label for="firstTrack">Start on audio track</label>
          <input id="firstTrack" type="number" min="1" value="1" class="narrow" />
        </div>
        <p class="hint">Each item goes on its own track (A1, A2, …) and overwrites what is there.</p>
      </div>
      <div class="row">
        <button id="generateBtn" class="primary">Generate &amp; import</button>
        <button id="clearPlanBtn">Clear</button>
      </div>
    </div>
  </section>

  <!-- Quick: no Claude, straight to ElevenLabs -->
  <section id="tab-quick" class="pane">
    <label for="quickType">Type</label>
    <select id="quickType">
      <option value="speech">Voiceover (text to speech)</option>
      <option value="sfx">Sound effect</option>
      <option value="music">Music</option>
    </select>

    <div id="quickVoiceRow">
      <label for="quickVoice">Voice</label>
      <select id="quickVoice"></select>
    </div>

    <label for="quickText" id="quickTextLabel">Text to speak</label>
    <textarea id="quickText" rows="5"></textarea>

    <div id="quickDurationRow" class="row hidden">
      <label for="quickDuration">Seconds (0 = auto)</label>
      <input id="quickDuration" type="number" min="0" step="0.5" value="0" class="narrow" />
    </div>

    <label class="check"><input type="checkbox" id="quickPlace" checked /> Place on timeline at playhead</label>
    <div class="row">
      <label for="quickTrack">Audio track</label>
      <input id="quickTrack" type="number" min="1" value="1" class="narrow" />
    </div>

    <div class="row">
      <button id="quickBtn" class="primary">Generate &amp; import</button>
    </div>
  </section>

  <!-- Settings -->
  <section id="tab-settings" class="pane">
    <label for="elevenKey">ElevenLabs API key</label>
    <input id="elevenKey" type="password" placeholder="xi-…" />

    <label for="claudeKey">Claude API key</label>
    <input id="claudeKey" type="password" placeholder="sk-ant-…" />
    <p class="hint">Keys are kept in your operating system's secure storage (Keychain / Credential Manager) on this computer only.</p>

    <label for="claudeModel">Claude model</label>
    <input id="claudeModel" type="text" />

    <label for="ttsModel">ElevenLabs voice model</label>
    <input id="ttsModel" type="text" />

    <label for="outputFormat">Audio format</label>
    <select id="outputFormat">
      <option value="mp3_44100_128">MP3 44.1 kHz 128 kbps (every plan)</option>
      <option value="mp3_44100_192">MP3 44.1 kHz 192 kbps (Creator+)</option>
      <option value="pcm_44100">WAV 44.1 kHz (Pro+)</option>
      <option value="pcm_48000">WAV 48 kHz (Pro+)</option>
    </select>

    <label>Save generated files to</label>
    <div class="row">
      <span id="outputFolder" class="path">Plugin data folder</span>
      <button id="chooseFolderBtn">Choose…</button>
    </div>

    <label for="binName">Project bin</label>
    <input id="binName" type="text" />

    <div class="row">
      <button id="saveSettingsBtn" class="primary">Save</button>
      <button id="testKeysBtn">Test keys</button>
    </div>
  </section>

  <footer>
    <div class="log-head">
      <span>Activity</span>
      <button id="clearLogBtn" class="link">clear</button>
    </div>
    <div id="log"></div>
  </footer>

  <script src="js/settings.js"></script>
  <script src="js/elevenlabs.js"></script>
  <script src="js/claude.js"></script>
  <script src="js/premiere.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
